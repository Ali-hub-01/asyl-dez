<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" fill="none" aria-hidden="true">
  <!-- прямой стебель по центру -->
  <path d="M150 312 C 149 240 150 150 150 26" stroke="#2E9E6E" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <g fill="#2E9E6E">
    <!-- нижняя пара -->
    <path transform="translate(150,262) rotate(54)"  d="M0 0 C26 -16 26 -62 0 -92 C-26 -62 -26 -16 0 0 Z" fill-opacity="0.82"/>
    <path transform="translate(150,262) rotate(-54)" d="M0 0 C26 -16 26 -62 0 -92 C-26 -62 -26 -16 0 0 Z" fill-opacity="0.82"/>
    <!-- средняя пара -->
    <path transform="translate(150,200) rotate(50)"  d="M0 0 C24 -15 24 -58 0 -86 C-24 -58 -24 -15 0 0 Z" fill-opacity="0.74"/>
    <path transform="translate(150,200) rotate(-50)" d="M0 0 C24 -15 24 -58 0 -86 C-24 -58 -24 -15 0 0 Z" fill-opacity="0.74"/>
    <!-- верхняя пара -->
    <path transform="translate(150,142) rotate(46)"  d="M0 0 C21 -13 21 -50 0 -74 C-21 -50 -21 -13 0 0 Z" fill-opacity="0.66"/>
    <path transform="translate(150,142) rotate(-46)" d="M0 0 C21 -13 21 -50 0 -74 C-21 -50 -21 -13 0 0 Z" fill-opacity="0.66"/>
    <!-- верхушка -->
    <path transform="translate(150,96)" d="M0 0 C18 -12 18 -48 0 -74 C-18 -48 -18 -12 0 0 Z" fill-opacity="0.6"/>
  </g>
  <!-- прожилки -->
  <g stroke="#0C2C42" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round">
    <path transform="translate(150,262) rotate(54)"  d="M0 -8 L0 -80"/>
    <path transform="translate(150,262) rotate(-54)" d="M0 -8 L0 -80"/>
    <path transform="translate(150,200) rotate(50)"  d="M0 -8 L0 -74"/>
    <path transform="translate(150,200) rotate(-50)" d="M0 -8 L0 -74"/>
    <path transform="translate(150,142) rotate(46)"  d="M0 -8 L0 -64"/>
    <path transform="translate(150,142) rotate(-46)" d="M0 -8 L0 -64"/>
    <path transform="translate(150,96)" d="M0 -8 L0 -64"/>
  </g>
</svg>
